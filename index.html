  <body>
    <div id="app"></div>
    <script>
const root = document.querySelector('#app');
const demoOffers = [
  { id: 'demo-1', name: 'นมสด UHT รสจืด', brand: 'Dutch Mill', productKey: 'dutch mill นมสด uht รสจืด', store: 'โลตัส', location: 'ทุกสาขา', purchaseUrl: 'https://www.lotuss.com/', price: 89, quantity: 1000, unit: 'ml', imageUrl: '', notes: 'แพ็ค 4 กล่อง', createdAt: Date.now() - 7200000 },
  { id: 'demo-2', name: 'นมสด UHT รสจืด', brand: 'Dutch Mill', productKey: 'dutch mill นมสด uht รสจืด', store: 'บิ๊กซี', location: 'สาขาใกล้บ้าน', purchaseUrl: 'https://www.bigc.co.th/', price: 95, quantity: 1000, unit: 'ml', imageUrl: '', notes: '', createdAt: Date.now() - 86400000 },
  { id: 'demo-3', name: 'กระดาษทิชชู่ 3 ชั้น', brand: 'Scott', productKey: 'scott กระดาษทิชชู่ 3 ชั้น', store: 'แม็คโคร', location: 'ออนไลน์', purchaseUrl: 'https://www.makro.pro/', price: 129, quantity: 24, unit: 'piece', imageUrl: '', notes: '24 ม้วน', createdAt: Date.now() - 172800000 },
  { id: 'demo-4', name: 'กระดาษทิชชู่ 3 ชั้น', brand: 'Scott', productKey: 'scott กระดาษทิชชู่ 3 ชั้น', store: 'บิ๊กซี', location: 'ทุกสาขา', purchaseUrl: 'https://www.bigc.co.th/', price: 139, quantity: 24, unit: 'piece', imageUrl: '', notes: '', createdAt: Date.now() - 259200000 },
  { id: 'demo-5', name: 'น้ำยาล้างจาน', brand: 'Sunlight', productKey: 'sunlight น้ำยาล้างจาน', store: 'โลตัส', location: 'ออนไลน์', purchaseUrl: 'https://www.lotuss.com/', price: 52, quantity: 750, unit: 'ml', imageUrl: '', notes: 'ขวด 750 มล.', createdAt: Date.now() - 432000000 }
];

const state = { offers: [], query: '', view: 'feed', selectedKey: null, modal: false, loading: true, error: '', busy: false, image: null, imagePreview: '', showUnitPrice: true, mode: 'connecting' };
const firebaseConfig = {
  apiKey: 'AIzaSyCZugoVgcRQkI0YjoCbIvsktIq9ElcWHog',
  authDomain: 'saveprice-9c5ab.firebaseapp.com',
  projectId: 'saveprice-9c5ab',
  storageBucket: 'saveprice-9c5ab.firebasestorage.app',
  messagingSenderId: '117954177360',
  appId: '1:117954177360:web:c21333cd9859b9dcbe2455'
};
let cloud = null;

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (value) => new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 }).format(Number(value) || 0);
const dateText = (value) => new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }).format(value || Date.now());
const normalize = (value) => String(value || '').trim().toLocaleLowerCase('th').replace(/\s+/g, ' ');
const keyFor = (name, brand) => normalize(`${brand} ${name}`);
const units = { piece: { label: 'ชิ้น', base: 'ชิ้น', factor: 1 }, g: { label: 'กรัม', base: 'กรัม', factor: 1 }, kg: { label: 'กิโลกรัม', base: 'กรัม', factor: 1000 }, ml: { label: 'มล.', base: 'มล.', factor: 1 }, l: { label: 'ลิตร', base: 'มล.', factor: 1000 } };
const unitPrice = (offer) => Number(offer.price) / (Number(offer.quantity) * (units[offer.unit]?.factor || 1));
const unitLabel = (offer) => units[offer.unit]?.base || 'ชิ้น';
const compatible = (a, b) => unitLabel(a) === unitLabel(b);
const safeUrl = (value) => { try { const url = new URL(value); return ['https:', 'http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } };
const image = (offer) => offer.imageUrl ? `<img src="${esc(offer.imageUrl)}" alt="${esc(offer.name)}" loading="lazy">` : `<div class="placeholder-art"><span>🛒</span><small>SavePrice</small></div>`;
const localKey = 'saveprice-community-demo-v1';

function readLocal() {
  try { return JSON.parse(localStorage.getItem(localKey) || 'null') || demoOffers; }
  catch { return demoOffers; }
}
function writeLocal(offers) { localStorage.setItem(localKey, JSON.stringify(offers)); }
function localSavedOffers() { return readLocal().filter(offer => String(offer.id || '').startsWith('local-')); }
function storeChoices() {
  const names = [...state.offers.map(offer => offer.store), '7-11', "Lotus's", 'Makro', 'Shopee', 'Lazada', 'บิ๊กซี', 'Watsons'];
  return [...new Map(names.filter(Boolean).map(name => [normalize(name), String(name).trim()])).values()].slice(0, 10);
}

async function connectFirebase() {
  try {
    const [{ initializeApp }, authSdk, dbSdk] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js')
    ]);
    const app = initializeApp(firebaseConfig);
    const auth = authSdk.getAuth(app);
    const db = dbSdk.getFirestore(app);
    let user = await new Promise((resolve, reject) => {
      let stop = () => {};
      stop = authSdk.onAuthStateChanged(auth, value => { stop(); resolve(value); }, reject);
    });
    if (!user) user = (await authSdk.signInAnonymously(auth)).user;
    cloud = { dbSdk, db, uid: user.uid };
    const offersRef = dbSdk.collection(db, 'users', user.uid, 'offers');
    dbSdk.onSnapshot(offersRef, snapshot => {
      state.offers = [...snapshot.docs.map(item => ({ id: item.id, ...item.data() })), ...localSavedOffers()]
        .sort((a, b) => b.createdAt - a.createdAt);
      state.mode = 'online'; state.error = ''; state.loading = false; render();
    }, error => {
      state.mode = 'local'; state.offers = readLocal(); state.error = `เชื่อมข้อมูลส่วนตัวไม่ได้: ${error.message}`; state.loading = false; render();
    });
  } catch (error) {
    state.mode = 'local'; state.offers = readLocal(); state.error = `เชื่อม Firebase ไม่ได้: ${error.message}`; state.loading = false; render();
  }
}

function groups() {
  const map = new Map();
  for (const offer of state.offers) {
    const key = offer.productKey || keyFor(offer.name, offer.brand);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(offer);
  }
  return [...map.entries()].map(([key, offers]) => {
    const comparable = offers.filter(item => compatible(item, offers[0]));
    const best = [...comparable].sort((a, b) => unitPrice(a) - unitPrice(b))[0] || offers[0];
    return { key, offers, best, newest: Math.max(...offers.map(x => x.createdAt || 0)) };
  }).sort((a, b) => b.newest - a.newest);
}

function topbar() { return `<header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-zap">✦</span><strong>SavePrice</strong></div><button class="header-profile" data-action="profile"><span>◉</span> โปรไฟล์</button></div><div class="topbar-caption">เก็บราคาไว้เทียบความคุ้ม · เริ่มที่สินค้าที่คุณเจอ</div></header>`; }
function searchBox() { return `<div class="search-box"><span class="search-glyph">⌕</span><input id="search" type="search" placeholder="ชื่อสินค้า แบรนด์ หรือร้านค้า" value="${esc(state.query)}" autocomplete="off">${state.query ? '<button type="button" class="search-clear" data-action="clear-search" aria-label="ล้างคำค้น">×</button>' : '<span class="search-shortcut">ค้นหา</span>'}</div>`; }
function card(group) {
  const { best, offers, key } = group;
  return `<button class="product-card text-card" data-action="detail" data-key="${esc(key)}"><div class="card-body"><div class="card-topline"><span class="best-label">คุ้มสุด</span></div><h3>${esc(best.name)}</h3>${best.brand ? `<div class="card-brand-secondary">${esc(best.brand)}</div>` : ''}<div class="card-store">⌂ ${esc(best.store)}</div><div class="card-price"><small>เริ่มต้น</small><strong>฿${money(best.price)}</strong></div>${state.showUnitPrice ? `<div class="card-unit">฿${money(unitPrice(best))} / ${unitLabel(best)}</div>` : ''}<div class="card-bottom"><span>${offers.length} ราคาให้เทียบ</span><span class="arrow">›</span></div></div></button>`;
}
function feed() {
  const all = groups();
  const filtered = all.filter(g => `${g.best.name} ${g.best.brand} ${g.offers.map(o => o.store).join(' ')}`.toLocaleLowerCase('th').includes(state.query.toLocaleLowerCase('th')));
  const suggestions = !state.query ? all.slice(0, 4).map(group => group.best.name) : [];
  const controls = state.view === 'feed' ? `<div class="feed-controls"><button class="chip ${state.showUnitPrice ? 'selected' : ''}" data-action="unit-toggle">฿/หน่วย ${state.showUnitPrice ? '✓' : ''}</button><button class="chip" data-action="search">⌕ ค้นหาสินค้า</button></div>` : `<div class="search-panel"><div class="search-title"><span>ค้นหาและเปรียบเทียบ</span><strong>หาของที่คุ้มกว่า</strong><small>ดูราคาเริ่มต้นและร้านที่ถูกสุดในที่เดียว</small></div>${searchBox()}${suggestions.length ? `<div class="search-suggestions"><span>ลองค้นหา</span><div>${suggestions.map(name => `<button type="button" data-action="quick-search" data-query="${esc(name)}">${esc(name)}</button>`).join('')}</div></div>` : ''}</div>`;
  return `<section class="content-section ${state.view === 'search' ? 'search-view' : 'feed-view'}">${controls}${state.view === 'search' ? `<div class="section-heading search-results-heading"><div><span>รายการสินค้า</span><h2>${state.query ? 'ผลการค้นหา' : 'ราคาที่บันทึกไว้'}</h2></div><span class="count">${filtered.length} สินค้า</span></div>` : ''}${state.loading ? `<div class="notice">กำลังโหลดราคา…</div>` : filtered.length ? `<div class="product-grid">${filtered.map(card).join('')}</div>` : `<div class="empty"><div class="empty-icon">⌕</div><h3>${state.query ? 'ยังไม่พบสินค้าที่ค้นหา' : 'ยังไม่มีราคาสินค้า'}</h3><p>${state.query ? 'ลองค้นหาด้วยชื่อหรือแบรนด์อื่น' : 'เริ่มบันทึกราคาสินค้าแรกของคุณ'}</p><button data-action="open-form">＋ เพิ่มราคาสินค้า</button></div>`}</section>`;
}
function detail() {
  const group = groups().find(g => g.key === state.selectedKey);
  if (!group) return feed();
  const sorted = [...group.offers].sort((a, b) => compatible(a, group.best) && compatible(b, group.best) ? unitPrice(a) - unitPrice(b) : Number(a.price) - Number(b.price));
  const best = sorted[0];
  return `<section class="detail"><button class="back" data-action="back">← กลับไปดูสินค้า</button><div class="detail-product"><div class="detail-image">${image(group.best)}</div><div class="detail-title"><span class="eyebrow dark">${esc(group.best.brand || 'สินค้า')}</span><h2>${esc(group.best.name)}</h2><p>เปรียบเทียบจาก ${group.offers.length} ราคาที่บันทึก</p></div></div><div class="comparison-head"><div><span>ราคาต่อหน่วยที่ดีที่สุด</span><strong>฿${money(unitPrice(best))} <small>/ ${unitLabel(best)}</small></strong></div><div class="medal">★</div></div><div class="section-heading compact"><div><span class="eyebrow dark">COMPARE OFFERS</span><h2>ราคาแต่ละร้าน</h2></div></div><div class="offer-list">${sorted.map((offer, i) => `<article class="offer ${i === 0 ? 'winner' : ''}"><div class="offer-rank">${i === 0 ? '★' : i + 1}</div><div class="offer-main"><div class="offer-top"><strong>${esc(offer.store)}</strong>${i === 0 ? '<span class="winner-label">คุ้มสุด</span>' : ''}</div><p>${esc(offer.location || 'ไม่ระบุสาขา')} · ${dateText(offer.createdAt)}${String(offer.id || '').startsWith('local-') ? ' · ในเครื่อง' : ''}</p><small>${money(offer.quantity)} ${units[offer.unit]?.label || 'ชิ้น'}${offer.notes ? ` · ${esc(offer.notes)}` : ''}</small>${safeUrl(offer.purchaseUrl) ? `<a href="${esc(safeUrl(offer.purchaseUrl))}" target="_blank" rel="noopener noreferrer" class="shop-link">ไปที่ร้าน ↗</a>` : ''}</div><div class="offer-price"><strong>฿${money(offer.price)}</strong><small>฿${money(unitPrice(offer))} / ${unitLabel(offer)}</small></div></article>`).join('')}</div><div class="detail-note">ราคาที่บันทึกอาจเปลี่ยนตามสาขาและเวลา โปรดตรวจสอบกับร้านก่อนซื้อ</div></section>`;
}
function profile() {
  const saved = state.offers.filter(offer => !String(offer.id || '').startsWith('demo-'));
  const products = new Set(saved.map(offer => offer.productKey || keyFor(offer.name, offer.brand))).size;
  const localCount = saved.filter(offer => String(offer.id || '').startsWith('local-')).length;
  const status = state.mode === 'online' ? 'เชื่อม Firebase แล้ว' : state.mode === 'connecting' ? 'กำลังเชื่อม Firebase' : 'เก็บในเบราว์เซอร์นี้';
  return `<section class="profile-view"><div class="profile-hero"><div class="profile-avatar">◉</div><button class="profile-edit" type="button" disabled aria-label="แก้ไขโปรไฟล์">✎</button><span class="eyebrow dark">MY SAVEPRICE</span><h2>โปรไฟล์ของฉัน</h2><p>พื้นที่บันทึกราคาส่วนตัว</p></div><div class="profile-status"><span class="status-dot ${state.mode === 'online' ? 'online' : ''}"></span><span>${status}</span></div><div class="profile-tabs"><button class="active" type="button">สินค้า (${saved.length})</button><button type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16v9H4zM8 4v3.5m8-3.5v3.5M7.5 12h.01M12 12h.01M16.5 12h.01"/></svg>ฝากบอกต่อ</button><button type="button" disabled aria-label="ถูกใจ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"/></svg></button><button type="button" disabled aria-label="การแจ้งเตือน"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8.5 13h5"/></svg></button></div>${saved.length ? `<div class="profile-offer-grid">${saved.slice(0, 12).map(offer => `<button class="profile-offer-card" data-action="detail" data-key="${esc(offer.productKey || keyFor(offer.name, offer.brand))}"><div class="profile-offer-image">${image(offer)}</div><div class="profile-offer-body"><span class="profile-offer-source">${String(offer.id || '').startsWith('local-') ? 'ในเครื่อง' : 'Firebase ส่วนตัว'}</span><strong>${esc(offer.name)}</strong>${offer.brand ? `<small class="profile-offer-brand">${esc(offer.brand)}</small>` : ''}<small class="profile-offer-store">⌂ ${esc(offer.store)}</small><div class="profile-offer-price"><b>฿${money(offer.price)}</b><span>${money(offer.quantity)} ${units[offer.unit]?.label || 'ชิ้น'}</span></div></div></button>`).join('')}</div>` : `<div class="profile-empty">ยังไม่มีราคาที่บันทึกเอง<br><button data-action="open-form">＋ บันทึกราคาแรก</button></div>`}<div class="profile-privacy"><strong>ข้อมูลของคุณ</strong><p>รายการใน Firebase ผูกกับบัญชีทดลองของเบราว์เซอร์นี้และไม่แชร์สาธารณะ${localCount ? ` · ${localCount} รายการยังเก็บอยู่ในเครื่อง` : ''}</p></div></section>`;
}
function form() {
  return `<div class="modal-wrap" role="presentation"><div class="modal-scrim" data-action="close-form"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="บันทึกราคาสินค้า">
      <div class="sheet-handle"></div>
      <div class="sheet-header"><div><span class="eyebrow dark">SAVE A PRICE</span><h2>บันทึกราคาที่เจอ</h2></div><button class="close" data-action="close-form" aria-label="ปิด">×</button></div>
      <p class="sheet-intro">เก็บภาพสินค้า ราคา และร้านค้าไว้เทียบครั้งถัดไป</p>
      <form id="offer-form">
        <label class="photo-upload" for="photo"><div id="photo-preview">${state.imagePreview ? `<img src="${esc(state.imagePreview)}" alt="ภาพสินค้า">` : `<span>▧</span><strong>เพิ่มรูปสินค้า</strong><small>แตะเพื่อเลือกรูปภาพ</small>`}</div></label>
        <input id="photo" name="photo" type="file" accept="image/*" capture="environment" hidden>
        <label>ชื่อสินค้า <b>*</b><input name="name" required maxlength="100" placeholder="เช่น นมสด UHT รสจืด"></label>
        <label>แบรนด์<input name="brand" maxlength="60" placeholder="เช่น Dutch Mill"></label>
        <label class="store-field">เจอที่ร้านไหน? <b>*</b><span class="store-input-wrap"><span class="store-icon">⌂</span><input id="store-input" name="store" required maxlength="80" autocomplete="off" placeholder="พิมพ์ชื่อร้าน หรือแตะเลือกด้านล่าง"></span></label>
        <div class="store-options"><span class="store-options-label">เลือกร้านที่เคยบันทึกหรือร้านยอดนิยม</span><div class="store-chips">${storeChoices().map(name => `<button type="button" class="store-chip" data-action="select-store" data-store="${esc(name)}">${esc(name)}</button>`).join('')}</div><small>ไม่พบร้านที่ต้องการ? พิมพ์ชื่อร้านใหม่ด้านบนได้เลย</small></div>
        <label>ราคา (บาท) <b>*</b><input name="price" type="number" min="0.01" max="100000000" step="0.01" required inputmode="decimal" placeholder="89"></label>
        <details class="advanced-details"><summary><span class="advanced-icon">＋</span><span><strong>เพิ่มข้อมูลเพิ่มเติม</strong><small>ปริมาณ · สาขา · ลิงก์ · โน้ต</small></span><span class="advanced-arrow">⌄</span></summary>
          <div class="advanced-fields">
            <label>ปริมาณสินค้า<div class="quantity"><input name="quantity" type="number" min="0.01" max="100000000" step="0.01" value="1" inputmode="decimal"><select name="unit"><option value="piece">ชิ้น</option><option value="g">กรัม</option><option value="kg">กก.</option><option value="ml">มล.</option><option value="l">ลิตร</option></select></div></label>
            <label>สาขา / พื้นที่<input name="location" maxlength="100" placeholder="เช่น สาขาพระราม 4 หรือ ออนไลน์"></label>
            <label>ลิงก์ไปซื้อ (ถ้ามี)<input name="purchaseUrl" type="url" maxlength="500" placeholder="https://..."></label>
            <label>รายละเอียดเพิ่มเติม<textarea name="notes" rows="2" maxlength="300" placeholder="เช่น แพ็ค 4 กล่อง โปรถึงสิ้นเดือน"></textarea></label>
          </div>
        </details>
        <p class="form-hint">${state.mode === 'online' ? 'บันทึกใน Firebase ส่วนตัวของเบราว์เซอร์นี้ ยังไม่แชร์กับคนอื่น' : 'ข้อมูลจะเก็บในเบราว์เซอร์นี้จนกว่าจะเชื่อม Firebase ได้'}</p>
        <button class="submit" type="submit" ${state.busy ? 'disabled' : ''}>${state.busy ? 'กำลังบันทึก…' : 'บันทึกราคานี้ →'}</button>
      </form>
    </section></div>`;
}
function footer() { return `<nav class="bottom-nav"><button class="${state.view === 'feed' ? 'active' : ''}" data-action="feed"><span>⌂</span>หน้าแรก</button><button class="${state.view === 'search' ? 'active' : ''}" data-action="search"><span>⌕</span>ค้นหา</button><button class="add-nav" data-action="open-form"><span>＋</span>บันทึก</button><button class="${state.view === 'profile' ? 'active' : ''}" data-action="profile"><span>◉</span>โปรไฟล์</button></nav>`; }
function render() {
  const localCount = localSavedOffers().length;
  const dataStatus = state.mode === 'online'
    ? `ทดลองส่วนตัว · Firebase เฉพาะบัญชีนี้${localCount ? ` · ${localCount} รายการเดิมยังอยู่ในเครื่อง` : ''}`
    : state.mode === 'connecting' ? 'กำลังเชื่อม Firebase ส่วนตัว…' : 'ออฟไลน์ · ข้อมูลเก็บในเบราว์เซอร์นี้';
  root.innerHTML = `<div class="app-shell">${topbar()}<main>${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ''}<div class="demo-banner">${dataStatus}</div>${state.view === 'detail' ? detail() : state.view === 'profile' ? profile() : feed()}</main>${footer()}${state.view === 'feed' ? `<button class="floating-add" data-action="open-form" aria-label="เพิ่มราคา">＋</button>` : ''}${state.modal ? form() : ''}<div id="toast" aria-live="polite"></div></div>`;
  const search = document.querySelector('#search');
  if (search && state.view !== 'detail' && document.activeElement?.id === 'search') search.focus();
}
function toast(message) { const el = document.querySelector('#toast'); if (el) { el.textContent = message; el.classList.add('visible'); setTimeout(() => el.classList.remove('visible'), 3200); } }
function openForm() { state.modal = true; state.image = null; state.imagePreview = ''; render(); }
async function compress(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 720 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas'); canvas.width = Math.round(bitmap.width * scale); canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height); bitmap.close();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.65));
  if (!blob) throw new Error('แปลงรูปภาพไม่สำเร็จ');
  return blob;
}
function blobDataUrl(blob) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); }); }
async function saveOffer(form) {
  if (state.busy) return;
  if (state.mode === 'connecting') { toast('กรุณารอเชื่อมข้อมูลส่วนตัวก่อน'); return; }
  const data = new FormData(form);
  const name = String(data.get('name') || '').trim(), brand = String(data.get('brand') || '').trim(), store = String(data.get('store') || '').trim();
  const price = Number(data.get('price')), quantity = Number(data.get('quantity') || 1);
  if (!name || !store || price <= 0 || quantity <= 0 || price > 100000000 || quantity > 100000000) { toast('กรุณาตรวจสอบชื่อสินค้า ร้านค้า ราคา และปริมาณ'); return; }
  const offer = { name, brand, productKey: keyFor(name, brand), store, location: String(data.get('location') || '').trim(), purchaseUrl: safeUrl(data.get('purchaseUrl')), price, quantity, unit: String(data.get('unit') || 'piece'), notes: String(data.get('notes') || '').trim(), imageUrl: '', createdAt: Date.now() };
  state.busy = true; render();
  try {
    if (state.image) {
      offer.imageUrl = await blobDataUrl(await compress(state.image));
      if (offer.imageUrl.length > 300000) throw new Error('รูปใหญ่เกินไป กรุณาเลือกรูปที่เล็กลง');
    }
    if (state.mode === 'online') {
      await cloud.dbSdk.addDoc(cloud.dbSdk.collection(cloud.db, 'users', cloud.uid, 'offers'), offer);
    } else {
      offer.id = `local-${Date.now()}`;
      const next = [offer, ...state.offers]; writeLocal(next); state.offers = next;
    }
    state.modal = false; state.image = null; state.imagePreview = ''; state.view = 'feed'; state.query = ''; render(); toast('บันทึกราคาเรียบร้อยแล้ว');
  } catch (error) { state.error = `บันทึกราคาไม่สำเร็จ: ${error.message}`; render(); }
  finally { state.busy = false; }
}

root.addEventListener('click', event => {
  const trigger = event.target.closest('[data-action]'); if (!trigger) return;
  const action = trigger.dataset.action;
  if (action === 'select-store') {
    const input = document.querySelector('#store-input');
    if (!input) return;
    input.value = trigger.dataset.store;
    document.querySelectorAll('.store-chip').forEach(chip => chip.classList.toggle('selected', chip.dataset.store === input.value));
    input.focus();
    return;
  }
  if (action === 'open-form') openForm();
  if (action === 'close-form') { state.modal = false; state.image = null; state.imagePreview = ''; render(); }
  if (action === 'unit-toggle') { state.showUnitPrice = !state.showUnitPrice; render(); }
  if (action === 'clear-search') { state.query = ''; render(); document.querySelector('#search')?.focus(); }
  if (action === 'quick-search') { state.view = 'search'; state.query = trigger.dataset.query; render(); document.querySelector('#search')?.focus(); }
  if (action === 'feed' || action === 'search' || action === 'profile') { state.view = action; state.query = ''; render(); }
  if (action === 'detail') { state.selectedKey = trigger.dataset.key; state.view = 'detail'; render(); document.querySelector('main')?.scrollTo(0, 0); }
  if (action === 'back') { state.view = 'feed'; render(); }
});
root.addEventListener('input', event => {
  if (event.target.id === 'store-input') {
    document.querySelectorAll('.store-chip').forEach(chip => chip.classList.toggle('selected', normalize(chip.dataset.store) === normalize(event.target.value)));
    return;
  }
  if (event.target.id !== 'search') return;
  const cursor = event.target.selectionStart;
  state.query = event.target.value;
  render();
  const input = document.querySelector('#search'); input?.focus(); input?.setSelectionRange(cursor, cursor);
});
root.addEventListener('change', async event => {
  if (event.target.id !== 'photo') return;
  const file = event.target.files?.[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { toast('กรุณาเลือกรูปภาพ'); return; }
  state.image = file;
  state.imagePreview = URL.createObjectURL(file);
  document.querySelector('#photo-preview').innerHTML = `<img src="${esc(state.imagePreview)}" alt="ภาพสินค้าที่เลือก">`;
});
root.addEventListener('submit', event => { if (event.target.id === 'offer-form') { event.preventDefault(); saveOffer(event.target); } });

state.offers = readLocal(); state.loading = false; render(); connectFirebase();

    </script>
  </body>
</html>
